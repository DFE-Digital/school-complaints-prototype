{% extends "layouts/main.html" %}

{% set pageName="Is the child still in education?" %}

{% set errorField = "child-still-in-education" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-full">
    {% include "includes/error-summary.html" %}
    <form method="get" action="/alpha-v01/child-still-in-education">
      <input type="hidden" name="submitted" value="true">
      <div class="govuk-form-group{% if error %} govuk-form-group--error{% endif %}">
        <fieldset class="govuk-fieldset" id="child-still-in-education"{% if error %} aria-describedby="child-still-in-education-error"{% endif %}>
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">
            <div class="gem-c-heading govuk-!-margin-bottom-6">
            <h1 class="gem-c-heading__text govuk-heading-xl govuk-fieldset__heading">Is the child still in education?</h1>
            </div>
          </legend>
          {% include "includes/error-message.html" %}
          <div class="govuk-radios" data-module="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="child-still-in-education-yes" name="child-still-in-education" type="radio" value="yes">
              <label class="govuk-label govuk-radios__label" for="child-still-in-education-yes">Yes</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="child-still-in-education-no" name="child-still-in-education" type="radio" value="no">
              <label class="govuk-label govuk-radios__label" for="child-still-in-education-no">No</label>
            </div>
          </div>
        </fieldset>
      </div>
      <button type="submit" class="govuk-button" data-module="govuk-button">Continue</button>
    </form>
  </div>
</div>

{% endblock %}
